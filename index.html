function openModal(title,sub,body,foot){document.getElementById("modalTitle").textContent=title;document.getElementById("modalSub").textContent=sub;document.getElementById("modalBody").innerHTML=body;document.getElementById("modalFoot").innerHTML=foot;document.getElementById("modalBackdrop").classList.add("show");bindActions(document.getElementById("modalBackdrop"))}
function stopEmployeeCamera(){if(employeeCameraStream){employeeCameraStream.getTracks().forEach(function(t){t.stop()});employeeCameraStream=null}const v=document.getElementById("employeeVideo");if(v){v.srcObject=null;v.classList.add("hidden")}}
function closeModal(){stopEmployeeCamera();document.getElementById("modalBackdrop").classList.remove("show")}
function enrollEmployeeForm(id,name){openModal("Xodim yuz shabloni",name+" · surat saqlanmaydi, faqat yuz shabloni shifrlanadi.",'<div class="notice">Xodimga maqsadni tushuntiring va aniq roziligini oling. Kamera tasviri tekshiruvdan keyin tashlanadi.</div><label class="checkline"><input id="employeeFaceConsent" type="checkbox"><span>Xodim yuz shablonini yaratishga rozilik berdi.</span></label><div style="width:100%;max-width:420px;margin:10px auto;background:#102b25;border-radius:9px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center;color:#c4d8d0"><video id="employeeVideo" autoplay muted playsinline class="hidden" style="width:100%;height:100%;object-fit:cover"></video><span id="employeeCameraHint">Kamera hali yoqilmagan.</span></div><canvas id="employeeCanvas" class="hidden"></canvas><p class="small" id="employeeFaceStatus">Rozilikdan keyin kamerani yoqing.</p>','<button class="btn" data-action="cancel">Bekor qilish</button><button class="btn" data-action="employee-camera" data-id="'+esc(id)+'">Kamerani yoqish</button><button class="btn primary" data-action="save-employee-face" data-id="'+esc(id)+'">Yuz shablonini saqlash</button>')}
async function startEmployeeCamera(){if(!document.getElementById("employeeFaceConsent").checked){toast("Avval xodimning roziligini oling.");return}stopEmployeeCamera();try{employeeCameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:960},height:{ideal:720}}});const v=document.getElementById("employeeVideo");v.srcObject=employeeCameraStream;v.classList.remove("hidden");document.getElementById("employeeCameraHint").classList.add("hidden");await v.play();document.getElementById("employeeFaceStatus").textContent="Yuzni kadr markaziga joylashtirib, shablonni saqlang."}catch(e){stopEmployeeCamera();toast("Kamera ochilmadi. HTTPS va brauzer ruxsatini tekshiring.")}}
function employeeFrame(){const v=document.getElementById("employeeVideo");if(!employeeCameraStream||v.readyState<2||!v.videoWidth)throw new Error("Avval xodim kamerasini yoqing.");const c=document.getElementById("employeeCanvas"),scale=Math.min(1,960/Math.max(v.videoWidth,v.videoHeight));c.width=Math.round(v.videoWidth*scale);c.height=Math.round(v.videoHeight*scale);c.getContext("2d").drawImage(v,0,0,c.width,c.height);let q=.82,d=c.toDataURL("image/jpeg",q);while(d.length>1500000&&q>.48){q-=.08;d=c.toDataURL("image/jpeg",q)}return d}
function newDeviceForm(){openModal("Yangi terminal","Kirish va chiqish uchun alohida planshet/token yarating. Token faqat bir marta ko‘rsatiladi.",'<form id="deviceForm"><div class="field"><label>Terminal nomi *</label><input name="name" required maxlength="80" placeholder="Masalan, Asosiy kirish plansheti"></div><div class="field"><label>Terminal vazifasi *</label><select name="direction" required><option value="entry">Kirish plansheti</option><option value="exit">Chiqish plansheti</option></select></div></form>','<button class="btn" data-action="cancel">Bekor qilish</button><button class="btn primary" data-action="save-device">Token yaratish</button>')}
async function createDevice(){const f=document.getElementById('deviceForm');if(!f.reportValidity())return;try{const d=await api('/api/admin/devices',{method:'POST',body:JSON.stringify({name:new FormData(f).get('name'),direction:new FormData(f).get('direction')})});createdToken=d.token;await refreshData();const urls=terminalUrls.map(function(u){return '<div><a href="'+esc(u+'/terminal')+'" target="_blank" rel="noopener">'+esc(u)+'/terminal</a></div>'}).join('');openModal('Terminal tokeni — faqat hozir ko‘rinadi','Tokenni shu vazifaga biriktirilgan planshetning /terminal sahifasiga kiriting.','<div class="field"><label>Bir martalik token</label><input id="createdToken" readonly value="'+esc(createdToken)+'" style="font-family:ui-monospace,monospace;font-size:11px"></div><div class="notice warn">Token yo‘qolsa, eskisini bekor qilib yangisini yarating. Skrinshotga olmang va ommaviy havolada yubormang.</div><div class="field"><label>Planshetda ochiladigan manzillar · shu Wi‑Fi tarmog‘ini tanlang</label>'+urls+'</div>','<button class="btn" data-action="copy-token">Tokenni nusxalash</button><button class="btn primary" data-action="cancel">Tayyor</button>');page='devices';render()}catch(e){toast(e.message)}}
function visitForm(){openModal("Tashrifni qo‘lda qayd etish","Planshet ishlamasa, tashrifni qo‘lda kiriting. Surat ixtiyoriy ravishda qo‘shilishi mumkin.",'<form id="visitForm"><div class="field"><label>F.I.Sh. *</label><input name="name" required placeholder="Masalan, Ali Valiyev"></div><div class="field"><label>Tashkilot</label><input name="org" placeholder="Ixtiyoriy"></div><div class="field"><label>Tashrif maqsadi</label><input name="purpose" placeholder="Ixtiyoriy"></div><div class="field"><label>Surat (ixtiyoriy)</label><input id="adminPhoto" type="file" accept="image/*" capture="user"></div><p class="notice blue">Planshetdan qayd etilganda tashrifchi yuz tekshiruvidan o‘tadi. Xodimlar tashrif sifatida saqlanmaydi.</p></form>','<button class="btn" data-action="cancel">Bekor qilish</button><button class="btn primary" data-action="save-visit">Qayd etish</button>')}
function employeeForm(){openModal("Xodim qo‘shish","Xodim ma’lumoti lokal bazaga saqlanadi. Yuz shabloni keyin xodimning roziligi bilan olinadi.",'<form id="employeeForm"><div class="field"><label>F.I.Sh. *</label><input name="name" required></div><div class="field"><label>Bo‘lim</label><input name="department" placeholder="Bo‘lim nomi"></div><div class="field"><label>Xodim IDsi</label><input name="id" placeholder="X-004"></div><div class="notice">Asl xodim surati saqlanmaydi. Avtomatik ajratish uchun alohida rozilik bilan yuz shabloni yoziladi.</div></form>','<button class="btn" data-action="cancel">Bekor qilish</button><button class="btn primary" data-action="save-employee">Xodimni qo‘shish</button>')}
async function fileToJpeg(file){return new Promise(function(resolve,reject){const img=new Image();img.onload=function(){const scale=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);let quality=.76,result=c.toDataURL('image/jpeg',quality);while(result.length>1900000&&quality>.45){quality-=.08;result=c.toDataURL('image/jpeg',quality)}if(result.length>1900000){reject(new Error('Suratni 2 MB dan kichik qilib qayta oling.'));return}resolve(result)};img.onerror=function(){reject(new Error('Surat faylini o‘qib bo‘lmadi.'))};img.src=URL.createObjectURL(file)})}
async function saveVisit(){const f=document.getElementById("visitForm");if(!f.reportValidity())return;const d=new FormData(f),file=document.getElementById('adminPhoto').files[0];try{const photoDataUrl=file?await fileToJpeg(file):null;await api('/api/admin/visits',{method:'POST',body:JSON.stringify({name:String(d.get('name')).trim(),organization:String(d.get('org')).trim(),purpose:String(d.get('purpose')).trim()||'Tashrif',photoDataUrl})});await refreshData();closeModal();render();toast(file?"Tashrif va surat saqlandi.":"Tashrif qo‘lda qayd etildi.")}catch(e){toast(e.message)}}
async function saveEmployee(){const f=document.getElementById("employeeForm");if(!f.reportValidity())return;const d=new FormData(f);try{const result=await api('/api/admin/employees',{method:'POST',body:JSON.stringify({name:String(d.get('name')).trim(),department:String(d.get('department')).trim(),id:String(d.get('id')).trim()})});await refreshData();closeModal();render();if(result.employee)enrollEmployeeForm(result.employee.id,result.employee.name);toast("Xodim qo‘shildi. Yuz shablonini ixtiyoriy yozishingiz mumkin.")}catch(e){toast(e.message)}}
async function saveEmployeeFace(id){if(!document.getElementById("employeeFaceConsent").checked){toast("Xodimning aniq roziligini belgilang.");return}try{const imageDataUrl=employeeFrame();document.getElementById("employeeFaceStatus").textContent="YOLO va SFace tekshiryapti…";const result=await api('/api/admin/employees/'+encodeURIComponent(id)+'/face-template',{method:'POST',body:JSON.stringify({consent:true,imageDataUrl})});stopEmployeeCamera();await refreshData();closeModal();render();toast(result.employee.name+" uchun shifrlangan yuz shabloni saqlandi; rasm saqlanmadi.")}catch(e){const status=document.getElementById("employeeFaceStatus");if(status)status.textContent=e.message;toast(e.message)}}
async function removeEmployeeFace(id){if(!confirm("Ushbu xodimning yuz shablonini o‘chirasizmi?"))return;try{await api('/api/admin/employees/'+encodeURIComponent(id)+'/face-template',{method:'DELETE'});await refreshData();render();toast("Yuz shabloni o‘chirildi.")}catch(e){toast(e.message)}}
function csv(rows,headers,name){const q=function(v){let s=String(v==null?"":v);if(/^[\s\u0000-\u001f]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const text=[headers].concat(rows).map(function(r){return r.map(q).join(",")}).join("\r\n");const blob=new Blob(["\ufeff"+text],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportVisits(){csv(visits.map(function(v){return [v.id,v.name,v.organization,v.purpose,dt(v.arrived),dt(v.departed),v.departed?"Chiqib ketgan":"Binoda",v.photoSaved?"Ha":"Yo‘q"]}),["Tashrif ID","F.I.Sh.","Tashkilot","Maqsad","Kirish","Chiqish","Holat","Surat saqlandi"],"tashriflar.csv")}
function bindPage(){const s=document.getElementById("visitSearch");if(s){s.value=query;s.addEventListener("input",function(){query=s.value;const r=document.getElementById("visitRows");r.innerHTML=visitRows(filtered(),true);bindActions(r)})}document.querySelectorAll("[data-filter]").forEach(function(b){b.addEventListener("click",function(){filter=b.dataset.filter;render()})});bindActions(document.getElementById("content"))}
function bindActions(root){if(!root)return;root.querySelectorAll("[data-action]").forEach(function(b){b.addEventListener("click",async function(){const a=b.dataset.action,id=b.dataset.id;if(a==="new-visit")visitForm();else if(a==="new-employee")employeeForm();else if(a==="new-device")newDeviceForm();else if(a==="cancel")closeModal();else if(a==="save-visit")saveVisit();else if(a==="save-employee")saveEmployee();else if(a==="enroll-employee"){const e=employees.find(function(x){return x.id===id});if(e)enrollEmployeeForm(e.id,e.name)}else if(a==="employee-camera")startEmployeeCamera();else if(a==="save-employee-face")saveEmployeeFace(id);else if(a==="remove-employee-face")removeEmployeeFace(id);else if(a==="save-device")createDevice();else if(a==="copy-token"){try{await navigator.clipboard.writeText(createdToken);toast("Token nusxalandi.")}catch(e){document.getElementById('createdToken').select();toast("Token maydonini nusxalab oling.")}}else if(a==="revoke-device"){if(!confirm("Ushbu planshet tokenini bekor qilasizmi?"))return;try{await api('/api/admin/devices/'+encodeURIComponent(id),{method:'DELETE'});await refreshData();render();toast("Terminal tokeni bekor qilindi.")}catch(e){toast(e.message)}}else if(a==="goto-visitors"){page="visitors";render()}else if(a==="goto-events"){page="events";render()}else if(a==="goto-camera"){page="camera";render()}else if(a==="goto-employees"){page="employees";render()}else if(a==="goto-device"){page="devices";render()}else if(a==="checkout"){const v=visits.find(function(x){return x.id===id});if(v&&!v.departed){try{await api('/api/admin/visits/'+encodeURIComponent(v.id)+'/checkout',{method:'POST',body:'{}'});await refreshData();render();toast("Chiqish vaqti qayd etildi.")}catch(e){toast(e.message)}}}else if(a==="export-visitors")exportVisits();else if(a==="export-events"){const rows=[];visits.forEach(function(v){rows.push([dt(v.arrived),v.name,v.organization,v.purpose,"Kirish",v.id]);if(v.departed)rows.push([dt(v.departed),v.name,v.organization,v.purpose,"Chiqish",v.id])});csv(rows,["Vaqt","F.I.Sh.","Tashkilot","Maqsad","Hodisa","Tashrif ID"],"kirish-chiqish.csv")}else if(a==="terminal-info")newDeviceForm();else if(a==="save-settings")toast("Lokal server sozlamalari faol.")})})}

document.getElementById("menuToggle").addEventListener("click",function(){document.getElementById("sidebar").classList.toggle("open")});
